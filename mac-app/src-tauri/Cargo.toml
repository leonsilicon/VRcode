[package]
name = "vrcode-mac-app"
version = "0.1.0"
description = "VRcode Mac: menu-bar app that runs and supervises the vrcode Mac service"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
core-foundation = "0.10"
libc = "0.2"
signal-hook = "0.3"
security-framework = "3"
